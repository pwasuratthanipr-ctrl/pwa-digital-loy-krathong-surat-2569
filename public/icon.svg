<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="50%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#073B66"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F4C66A"/>
      <stop offset="100%" stop-color="#D49A24"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FFF9C4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#waterGrad)" />
  
  <!-- Water Ripples -->
  <path d="M 90 350 Q 180 330 256 350 T 422 350" stroke="#90E0EF" stroke-width="6" fill="none" opacity="0.6"/>
  <path d="M 60 380 Q 170 360 256 380 T 452 380" stroke="#CAF0F8" stroke-width="5" fill="none" opacity="0.4"/>
  <path d="M 120 410 Q 200 395 256 410 T 392 410" stroke="#90E0EF" stroke-width="4" fill="none" opacity="0.5"/>

  <!-- Krathong Base -->
  <path d="M 120 330 C 130 380, 382 380, 392 330 Z" fill="#2D6A4F" />
  <path d="M 110 335 Q 256 370 402 335 Q 256 385 110 335 Z" fill="#40916C" />
  
  <!-- Lotus Petals Outer -->
  <path d="M 140 330 Q 120 280 180 270 Q 190 320 140 330 Z" fill="#F6B8D2" />
  <path d="M 372 330 Q 392 280 332 270 Q 322 320 372 330 Z" fill="#F6B8D2" />
  <path d="M 180 320 Q 180 250 230 250 Q 230 310 180 320 Z" fill="#F48FB1" />
  <path d="M 332 320 Q 332 250 282 250 Q 282 310 332 320 Z" fill="#F48FB1" />
  
  <!-- Central Lotus / Water Drop Symbol -->
  <path d="M 256 210 Q 220 280 256 320 Q 292 280 256 210 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Candle and Incense Sticks -->
  <rect x="250" y="150" width="12" height="70" fill="#FFF8E1" rx="3" />
  <rect x="238" y="160" width="4" height="60" fill="#E65100" />
  <rect x="270" y="160" width="4" height="60" fill="#E65100" />
  
  <!-- Candle Flame -->
  <path d="M 256 100 Q 242 135 256 150 Q 270 135 256 100 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="135" r="5" fill="#FFFFFF" />
  
  <!-- Golden Sparks -->
  <circle cx="210" cy="140" r="4" fill="#F4C66A" opacity="0.8"/>
  <circle cx="300" cy="130" r="5" fill="#FFE082" opacity="0.9"/>
  <circle cx="240" cy="90" r="3" fill="#FFF9C4" opacity="0.8"/>
  <circle cx="275" cy="80" r="3.5" fill="#FFE082" opacity="0.7"/>
</svg>
